services:
  #############################################################
  #                 Nginx CONFIG BLOCK                        #
  #############################################################
  nginx:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    hostname: nginx
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - node-network

  #############################################################
  #               FTP server CONFIG BLOCK                     #
  #############################################################
  sftp:
    image: atmoz/sftp
    volumes:
      - ./ftp:/home/ftpadmin/ftp
    ports:
      - "2222:22"
    command: ftpadmin:magicmirror_2025!:1001::ftp
    networks:
      - node-network

  #############################################################
  #                 Backend CONFIG BLOCK                      #
  #############################################################
  backend:
    image: node:lts-alpine
    hostname: backend
    container_name: backend
    restart: unless-stopped
    working_dir: /usr/src/app
    command: npm start
    volumes:
      - ./ftp/backend/:/usr/src/app
      - ./ftp/assets/:/usr/src/assets
    environment:
      - MONGODB_URI=mongodb://admin:supersecurepassword123@mongodb:27017/articlesDashboardDb?authSource=admin
      - MONGODB_SERVER=mongodb:27017
      - MONGODB_DATABASE=articlesDashboardDb
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=supersecurepassword123
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:5000
      - PORT=2567
      - ADMIN_USER_NAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
    ports:
      - "2567:2567"
    expose:
      - 2567
    depends_on:
      mongo:
        condition: service_healthy
      nginx:
        condition: service_started
    networks:
      - node-network

  #############################################################
  #                 Static Site CONFIG BLOCK                  #
  #############################################################
  frontend:
    image: nginx:latest
    restart: unless-stopped
    hostname: frontend
    container_name: frontend
    volumes:
      - ./ftp/frontend/html:/etc/nginx/html
      - ./ftp/frontend/html2:/usr/share/nginx/html
      - ./ftp/frontend/nginx/config:/etc/nginx/conf.d
    ports:
      - "8000:80"
    depends_on:
      - nginx
      - backend
    networks:
      - node-network

  #############################################################
  #                   MongoDB CONFIG BLOCK                    #
  #############################################################
  mongo:
    image: mongo:4.2
    hostname: mongodb
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - ./mongodb_data:/data/db
    ports:
      - "27017:27017"
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=supersecurepassword123
      - MONGO_INITDB_DATABASE=articlesDashboardDb
    command: >
      mongod
      --dbpath /data/db
      --profile 2
      --slowms 1
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || mongo --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - node-network



  #############################################################
  #                   Mongo-express CONFIG BLOCK              #
  #############################################################
  mongo-express:
    image: mongo-express
    restart: unless-stopped
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://admin:supersecurepassword123@mongodb:27017/admin?authSource=admin
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=betterleague_2025!
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - node-network


networks:
  node-network:
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
          aux_addresses:
            mongodb: 172.25.0.2
