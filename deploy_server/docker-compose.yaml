services:
  #############################################################
  #                 Nginx CONFIG BLOCK                        #
  #############################################################
  nginx:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    hostname: nginx
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - node-network

  #############################################################
  #               FTP server CONFIG BLOCK                     #
  #############################################################
  sftp:
    image: atmoz/sftp
    volumes:
      - ./ftp:/home/ftpadmin/ftp
    ports:
      - "2222:22"
    command: ftpadmin:magicmirror_2025!:1001::ftp
    networks:
      - node-network

  #############################################################
  #                 Backend CONFIG BLOCK                      #
  #############################################################
  backend:
    image: node:lts-alpine
    hostname: backend
    container_name: backend
    restart: unless-stopped
    working_dir: /usr/src/app
    command: npm start

    volumes:
      - ./ftp/backend/:/usr/src/app
      - ./ftp/assets/:/usr/src/assets

    environment:
      - MONGODB_URI=mongodb://admin:supersecurepassword123@mongodb:27017/articlesDashboardDb?authSource=admin
      - MONGODB_SERVER=mongodb:27017
      - MONGODB_DATABASE=articlesDashboardDb
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=supersecurepassword123

      - FRONTEND_URL=http://192.168.101.141:8000
      - BACKEND_URL=http://192.168.101.141:2567
      - PORT=2567

      - ADMIN_USER_NAME=admin
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123

      - JWT_ACCESS_SECRET=metti_qui_una_secret_lunga_e_casuale
      - JWT_REFRESH_SECRET=metti_qui_un_altra_secret_lunga_e_casuale
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d

      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - GETTY_API_KEY=${GETTY_API_KEY}
      - GETTY_API_SECRET=${GETTY_API_SECRET}

      - EMBEDDING_ARTICOLI_AI_KEY=${EMBEDDING_ARTICOLI_AI_KEY}

    ports:
      - "2567:2567"

    expose:
      - 2567

    depends_on:
      mongodb:
        condition: service_healthy

      nginx:
        condition: service_started

      redis:
        condition: service_started

    networks:
      - node-network

  #############################################################
  #                 Static Site CONFIG BLOCK                  #
  #############################################################
  frontend:
    image: nginx:latest
    restart: unless-stopped
    hostname: frontend
    container_name: frontend

    volumes:
      - ./ftp/frontend/html:/etc/nginx/html
      - ./ftp/frontend/html2:/usr/share/nginx/html
      - ./ftp/frontend/nginx/config:/etc/nginx/conf.d

    ports:
      - "8000:80"

    depends_on:
      - nginx
      - backend

    networks:
      - node-network

  #############################################################
  #                   MongoDB CONFIG BLOCK                    #
  #############################################################
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    hostname: mongodb
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    mem_limit: 2g
    mem_reservation: 1g

    environment:
      - MONGODB_INITDB_ROOT_USERNAME=admin
      - MONGODB_INITDB_ROOT_PASSWORD=supersecurepassword123

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - mongodb_mongot:/data/mongot

    networks:
      - node-network

  #############################################################
  #                   Mongo-express CONFIG BLOCK              #
  #############################################################
  mongo-express:
    image: mongo-express
    restart: unless-stopped

    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://admin:supersecurepassword123@mongodb:27017/admin?authSource=admin
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=betterleague_2025!

    depends_on:
      mongodb:
        condition: service_healthy

    ports:
      - "8081:8081"

    networks:
      - node-network

  #############################################################
  #                  Redis CONFIG BLOCK                       #
  #############################################################
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - node-network

  #############################################################
  #                    n8n CONFIG BLOCK                       #
  #############################################################
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - GENERIC_TIMEZONE=Europe/Rome
      - TZ=Europe/Rome
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - node-network


#############################################################
#                         VOLUMES                            #
#############################################################
volumes:
  mongodb_data:
  mongodb_config:
  mongodb_mongot:
  n8n_data:


#############################################################
#                         NETWORKS                           #
#############################################################
networks:
  node-network:
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
          aux_addresses:
            mongodb: 172.25.0.2